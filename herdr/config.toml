onboarding = false
[keys]
prefix = "alt+space"

# Ghostty forwards Cmd chords as CSI u sequences (ghostty/config.ghostty).
# Keep the prefix bindings available alongside the direct macOS shortcuts.
new_tab          = ["prefix+c", "cmd+t"]
close_tab        = ["prefix+shift+x", "cmd+w"]
split_vertical   = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
switch_tab       = ["prefix+1..9", "alt+1..9", "cmd+1..9"]

# Direct chords (no prefix): every press works on its own, so they repeat.
# Vim-style: workspaces stack top-to-bottom (j/k), panes run left-to-right (h/l).
# Needs Ghostty's macos-option-as-alt = true (set in ghostty/config.ghostty). Overrides zsh's alt+h (run-help) and alt+l (ls).
next_workspace      = "alt+j"
previous_workspace  = "alt+k"
cycle_pane_next     = ["prefix+tab", "alt+l"]
cycle_pane_previous = ["prefix+shift+tab", "alt+h"]

[ui]
# Cmd+T opens a tab immediately with a generated name.
prompt_new_tab_name = false
