onboarding = false
[keys]
prefix = "alt+space"

# Direct chords (no prefix): every press works on its own, so they repeat.
# Vim-style: workspaces stack top-to-bottom (j/k), panes run left-to-right (h/l).
# Needs iTerm's Option keys = Esc+ (both are set). Overrides zsh's alt+h (run-help) and alt+l (ls).
next_workspace      = "alt+j"
previous_workspace  = "alt+k"
cycle_pane_next     = ["prefix+tab", "alt+l"]
cycle_pane_previous = ["prefix+shift+tab", "alt+h"]

# alt+1..9 jumps straight to tab N in the current workspace.
# Overrides zsh's alt+<digit> (digit-argument), which is rarely used.
[keys.indexed]
tabs = "alt"
